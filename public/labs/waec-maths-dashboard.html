<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:image" content="https://learnwith-nehyy.netlify.app/.netlify/og-image/789205840a43ccc81bbe53649e714bb0.jpg">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAEC Mathematics — Syllabus Axis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF7;
    --paper-line:#E3E6EC;
    --ink:#1B2A4A;
    --ink-soft:#5B6478;
    --rail:#12203B;
    --rail-ink:#EDEFF4;
    --rail-ink-dim:#8C96B3;
    --red:#B5322F;
    --teal:#1D7A63;
    --amber:#D9A441;
    --card:#FFFFFF;
    --radius:2px;
    --rail-w:300px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--amber); color:var(--ink);}
  a{color:inherit;}

  /* ---------- Layout shell ---------- */
  .app{ display:grid; grid-template-columns: var(--rail-w) 1fr; min-height:100vh; }

  /* ---------- Rail / sidebar (the axis) ---------- */
  .rail{
    background:var(--rail); color:var(--rail-ink);
    position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:26px 0 40px; border-right:1px solid #0A1428;
  }
  .rail-header{ padding:0 22px 20px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:6px; }
  .rail-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:0 0 6px; }
  .rail-title{ font-family:'Source Serif 4', serif; font-weight:600; font-size:22px; line-height:1.25; margin:0 0 10px; }
  .rail-sub{ font-size:12.5px; color:var(--rail-ink-dim); line-height:1.5; margin:0; }

  .axis{ position:relative; margin:22px 22px 0 30px; padding-left:20px; border-left:2px solid rgba(255,255,255,.16); }
  .axis::before{ content:""; position:absolute; left:-5px; top:-14px; width:0;height:0;
    border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid rgba(255,255,255,.28); }
  .tick{ position:relative; margin-bottom:2px; }
  .tick::before{ content:""; position:absolute; left:-22px; top:19px; width:12px; height:2px; background:rgba(255,255,255,.25); }
  .tick-btn{
    width:100%; text-align:left; background:transparent; border:none; color:var(--rail-ink);
    font-family:inherit; padding:11px 12px 11px 14px; display:flex; align-items:flex-start; gap:11px;
    cursor:pointer; border-radius:var(--radius); transition:background .15s ease;
  }
  .tick-btn:hover{ background:rgba(255,255,255,.06); }
  .tick-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }
  .tick.active .tick-btn{ background:rgba(217,164,65,.14); }
  .tick.active::before{ background:var(--amber); width:16px; }
  .tick-glyph{
    font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; color:var(--rail-ink-dim);
    width:26px; height:26px; flex:0 0 auto; border:1px solid rgba(255,255,255,.18); border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.03);
  }
  .tick.active .tick-glyph{ color:var(--rail); background:var(--amber); border-color:var(--amber); }
  .tick-text{ padding-top:2px; }
  .tick-code{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.08em; color:var(--rail-ink-dim); display:block; margin-bottom:2px; }
  .tick.active .tick-code{ color:var(--amber); }
  .tick-name{ font-size:14px; font-weight:500; line-height:1.3; }
  .tick-count{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--rail-ink-dim); margin-top:3px; }
  .rail-foot{ margin:26px 22px 0; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:var(--rail-ink-dim); line-height:1.6; }
  .rail-foot b{ color:var(--rail-ink); }

  /* ---------- Main column ---------- */
  .main{ min-width:0; }
  .scrim{ display:none; } /* only participates in layout on mobile — see media query */
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(250,250,247,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--paper-line); padding:16px 34px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .rail-toggle{
    display:none; background:var(--rail); color:var(--rail-ink); border:none; border-radius:var(--radius);
    width:38px; height:38px; font-family:'JetBrains Mono',monospace; font-size:16px; cursor:pointer; flex:0 0 auto;
  }
  .back-home{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; text-decoration:none;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);
    padding:8px 13px; border:1px solid var(--paper-line); border-radius:var(--radius); background:var(--card);
  }
  .back-home:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .search-wrap{ position:relative; flex:1 1 260px; max-width:460px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.45; }
  #search{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; padding:10px 14px 10px 36px;
    border:1px solid var(--paper-line); background:var(--card); border-radius:var(--radius); color:var(--ink);
  }
  #search:focus-visible{ outline:2px solid var(--red); outline-offset:1px; }
  .topbar-meta{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }

  .content{ padding:34px; max-width:1000px; }

  .topic-head{ margin-bottom:22px; }
  .topic-head .code-badge{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--red); letter-spacing:.1em; text-transform:uppercase; }
  .topic-head h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:clamp(26px,4vw,36px); margin:6px 0 8px; line-height:1.15; }
  .topic-head p{ color:var(--ink-soft); font-size:14.5px; max-width:64ch; line-height:1.55; margin:0; }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--paper-line); border:1px solid var(--paper-line); margin-bottom:28px; }
  .stat{ background:var(--card); padding:16px 18px; }
  .stat .n{ font-family:'JetBrains Mono', monospace; font-size:26px; font-weight:700; color:var(--red); line-height:1; }
  .stat .l{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.06em; }

  .overview-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:8px; }
  .overview-card{ background:var(--card); border:1px solid var(--paper-line); border-left:3px solid var(--ink); padding:16px 18px; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
  .overview-card:hover{ transform:translateY(-2px); border-left-color:var(--red); }
  .overview-card:focus-visible{ outline:2px solid var(--red); }
  .overview-card .oc-code{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.08em; }
  .overview-card h3{ font-family:'Source Serif 4', serif; font-size:16.5px; margin:4px 0 6px; font-weight:600; }
  .overview-card .oc-count{ font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono', monospace; }

  .units-panel{ margin-top:30px; border:1px dashed var(--paper-line); padding:18px 20px; background:repeating-linear-gradient(135deg, rgba(27,42,74,.02) 0 10px, transparent 10px 20px); }
  .units-panel h2{ font-family:'Source Serif 4', serif; font-size:17px; margin:0 0 12px; }
  .units-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .units-table td{ padding:6px 10px 6px 0; vertical-align:top; border-bottom:1px solid var(--paper-line); }
  .units-table td:first-child{ font-weight:600; white-space:nowrap; color:var(--ink); width:120px; }

  .accordion{ display:flex; flex-direction:column; gap:10px; }
  .item{ background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); overflow:hidden; }
  .item-head{
    width:100%; display:flex; align-items:center; gap:14px; background:transparent; border:none;
    padding:15px 18px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink);
  }
  .item-head:focus-visible{ outline:2px solid var(--red); outline-offset:-2px; }
  .item-code{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:#fff; background:var(--ink);
    min-width:24px; height:24px; padding:0 4px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .item.open .item-code{ background:var(--red); }
  .item-title{ flex:1; font-size:15px; font-weight:600; font-family:'Source Serif 4', serif; }
  .item-chevron{ font-family:'JetBrains Mono', monospace; color:var(--ink-soft); transition:transform .18s ease; flex:0 0 auto; }
  .item.open .item-chevron{ transform:rotate(90deg); color:var(--red); }
  .item-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .item.open .item-body{ max-height:2200px; }
  .item-body-inner{ padding:0 20px 20px 58px; }
  .body-block{ margin-bottom:16px; }
  .body-block:last-child{ margin-bottom:0; }
  .body-label{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px; }
  .body-label.content{ color:var(--teal); }
  .body-label.notes{ color:var(--red); }
  .body-label.sim{ color:#8A6414; }
  ul.content-list{ margin:0; padding-left:18px; font-size:14px; line-height:1.6; color:var(--ink); }
  ul.content-list li{ margin-bottom:4px; }
  .note-box{
    font-size:13.5px; line-height:1.6; color:#5a2320; background:#FBF1EE; border-left:3px solid var(--red);
    padding:10px 14px; font-family:'Source Serif 4', serif; font-style:italic;
  }

  .empty{ padding:60px 10px; text-align:center; color:var(--ink-soft); }
  .empty .big{ font-family:'JetBrains Mono',monospace; font-size:40px; color:var(--paper-line); }

  .back-link{ display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:0; margin-bottom:16px; }
  .back-link:hover{ color:var(--red); }
  mark{ background:var(--amber); color:var(--ink); padding:0 1px; }

  /* ---------- Simulation widgets ---------- */
  .sim-panel{ background:#FBFAF6; border:1px solid var(--paper-line); border-radius:var(--radius); padding:16px; }
  .sim-controls{ display:flex; flex-wrap:wrap; gap:14px 20px; margin-bottom:12px; align-items:flex-end; }
  .sim-field{ display:flex; flex-direction:column; gap:5px; min-width:150px; flex:1 1 150px; }
  .sim-label{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .sim-val{ color:var(--red); font-weight:600; }
  input[type=range]{ accent-color: var(--red); width:100%; }
  .sim-select, .sim-input, .sim-input-text{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:7px 8px;
    border:1px solid var(--paper-line); border-radius:var(--radius); background:#fff; color:var(--ink);
  }
  .sim-input{ width:100%; }
  .sim-input-text{ width:100%; }
  .sim-canvas-wrap{ margin-bottom:12px; overflow-x:auto; }
  .sim-canvas{ display:block; border:1px solid var(--paper-line); background:#fff; max-width:100%; height:auto; }
  .sim-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.03em; background:var(--ink);
    color:#fff; border:none; padding:9px 14px; border-radius:var(--radius); cursor:pointer;
  }
  .sim-btn:hover{ background:var(--red); }
  .sim-result{ display:flex; flex-direction:column; gap:6px; }
  .sim-result-row{ display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:7px 10px; background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius); flex-wrap:wrap; }
  .sim-result-label{ color:var(--ink-soft); }
  .sim-result-value{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--ink); }
  .sim-steps{ margin-top:8px; font-size:12px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; line-height:1.6; }
  .sim-step-label{ font-size:12px; color:var(--ink-soft); margin:4px 0; }
  .sim-hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; font-style:italic; }
  .sim-error{ color:var(--red); font-size:12.5px; }
  .sim-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .sim-table th,.sim-table td{ border:1px solid var(--paper-line); padding:6px 8px; text-align:left; }
  .sim-matrix-2x2{ display:grid; grid-template-columns:1fr 1fr; gap:4px; width:104px; }
  .sim-matrix{ display:flex; flex-direction:column; gap:6px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 880px){
    .app{ grid-template-columns:1fr; }
    .rail{ position:fixed; z-index:20; inset:0 auto 0 0; width:min(84vw, 320px); transform:translateX(-100%); transition:transform .22s ease; box-shadow:2px 0 24px rgba(0,0,0,.35); }
    .rail.open{ transform:translateX(0); }
    .rail-toggle{ display:inline-flex; align-items:center; justify-content:center; }
    .content{ padding:22px 18px; }
    .topbar{ padding:14px 18px; }
    .item-body-inner{ padding-left:20px; }
    .scrim{ position:fixed; inset:0; background:rgba(10,15,30,.4); z-index:19; }
    .scrim.show{ display:block; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
  :root.night .item-code{ color:#211e36; }
  .item.open .item-body{ max-height:none; }
  .sim-panel.mk-host{ padding:14px; }
</style>

</head>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search subtopics, formulas, notes… e.g. surds, logarithms, bearings">

<script>
/* ======================================================================
   DATA — WAEC General Mathematics / Mathematics (Core) syllabus
   Every subtopic carries: content[], notes, and a sim{} config that
   drives a live, interactive simulation rendered on expand.
   ====================================================================== */
const SYLLABUS = [
{code:'A', glyph:'№', title:'Number and Numeration',
 desc:'Number bases, arithmetic, indices, logarithms, sequences, sets, logic and financial mathematics.',
 subtopics:[
  {code:'a', title:'Number bases', content:['Conversion of numbers from one base to another', 'Basic operations on number bases: addition, subtraction and multiplication'], notes:'Conversion from one base to base 10 and vice versa; conversion from one base directly to another base.',
   sim:{engine:'baseConverter'}},
  {code:'b', title:'Modular Arithmetic', content:['Concept of modulo arithmetic', 'Addition, subtraction and multiplication in modulo arithmetic', 'Application to daily life'], notes:'Interpret e.g. 6 + 4 = k(mod 7), 3 × 5 = b(mod 6), m = 2(mod 3). Relate to market days, clocks and shift duty.',
   sim:{engine:'moduloClock', a:6, b:4, n:7}},
  {code:'c', title:'Fractions, Decimals and Approximations', content:['Basic operations on fractions and decimals', 'Approximations and significant figures'], notes:'Approximations should be realistic — e.g. a road is not measured to the nearest centimetre.',
   sim:{engine:'numberLine', mode:'rounding'}},
  {code:'d', title:'Indices', content:['Laws of indices: aˣ·aʸ = aˣ⁺ʸ, aˣ÷aʸ = aˣ⁻ʸ, (aˣ)ʸ = aˣʸ, for real x, y and a ≠ 0', 'Numbers in standard form (scientific notation)'], notes:'Include negative and fractional indices. E.g. 375 300 000 = 3.753 × 10⁸; 0.00000035 = 3.5 × 10⁻⁷.',
   sim:{engine:'calcSliders', vars:[
      {key:'a',label:'a',min:2,max:9,step:1,default:3},
      {key:'x',label:'x',min:0,max:5,step:1,default:2},
      {key:'y',label:'y',min:0,max:5,step:1,default:3}
    ], formulas:[
      {label:'aˣ', fn:v=>Math.pow(v.a,v.x)},
      {label:'aʸ', fn:v=>Math.pow(v.a,v.y)},
      {label:'aˣ × aʸ', fn:v=>Math.pow(v.a,v.x)*Math.pow(v.a,v.y)},
      {label:'aˣ⁺ʸ (law check)', fn:v=>Math.pow(v.a,v.x+v.y)}
    ]}},
  {code:'e', title:'Logarithms', content:['Relationship between indices and logarithms: y = 10ᵏ ⇒ log₁₀y = k', 'Rules: log(pq) = log p + log q; log(p/q) = log p − log q; log pⁿ = n·log p', 'Use of tables of logarithms and antilogarithms'], notes:'Calculations involving multiplication, division, powers and roots.',
   sim:{engine:'calcSliders', vars:[
      {key:'p',label:'p',min:1,max:100,step:1,default:20},
      {key:'q',label:'q',min:1,max:100,step:1,default:5}
    ], formulas:[
      {label:'log₁₀p', fn:v=>Math.log10(v.p), decimals:4},
      {label:'log₁₀q', fn:v=>Math.log10(v.q), decimals:4},
      {label:'log₁₀p + log₁₀q', fn:v=>Math.log10(v.p)+Math.log10(v.q), decimals:4},
      {label:'log₁₀(pq) (law check)', fn:v=>Math.log10(v.p*v.q), decimals:4}
    ]}},
  {code:'f', title:'Sequence and Series', content:['Patterns of sequences', 'Arithmetic Progression (A.P.) and Geometric Progression (G.P.)'], notes:'Determine any term Uₙ of a sequence. Include the sum for A.P.; exclude the sum for G.P.',
   sim:{engine:'sequenceBars', a1:3, d:4, n:8}},
  {code:'g', title:'Sets', content:['Universal, finite and infinite sets; subsets, empty sets, disjoint sets', 'Union, intersection and complement of sets', 'Practical classification problems using Venn diagrams'], notes:'Notation: ℰ, ⊂, ∪, ∩, { }, ∅, P′. Venn diagrams restricted to at most 3 sets.',
   sim:{engine:'venn3'}},
  {code:'h', title:'Logical Reasoning', content:['Simple statements; true and false statements', 'Negation of statements, implications'], notes:'Use of symbols ⟹, ⇐ and Venn diagrams.',
   sim:{engine:'truthTable'}},
  {code:'i', title:'Positive & Negative Integers, Rational Numbers', content:['The four basic operations on rational numbers', 'Matching rational numbers with points on the number line'], notes:'Notation: Natural numbers (N), Integers (Z), Rational numbers (Q).',
   sim:{engine:'numberLine', mode:'rational'}},
  {code:'j', title:'Surds (Radicals)', content:['Simplification and rationalization of simple surds'], notes:'Surds of the form √b, a√b, a ± √b. Excludes surds of the form 1/(√a ± √b).',
   sim:{engine:'calcSliders', vars:[{key:'b',label:'b (radicand)',min:2,max:200,step:1,default:48}], formulas:[
      {label:'√b simplified', fn:v=>{
        let n=Math.round(v.b), k=1, m=n;
        for(let f=2; f*f<=m; f++){ while(m%(f*f)===0){ m/=(f*f); k*=f; } }
        return k===1 ? `√${m}` : `${k}√${m}`;
      }}
   ]}},
  {code:'k', title:'Matrices and Determinants', content:['Order, notation and types of matrices', 'Addition, subtraction, scalar multiplication and multiplication of matrices', 'Determinant of a matrix'], notes:'Restricted to matrices no larger than 3 × 3. Determinants restricted to 2 × 2.',
   sim:{engine:'matrixCalc'}},
  {code:'l', title:'Ratio, Proportions and Rates', content:['Ratio between two similar quantities', 'Proportion between two or more similar quantities', 'Financial partnerships, rates of work, costs, taxes, foreign exchange, density, speed'], notes:'Relate to real-life situations; includes average rates and taxes such as VAT.',
   sim:{engine:'calcSliders', vars:[
      {key:'dist',label:'Distance',min:10,max:500,step:10,default:150,unit:'km'},
      {key:'time',label:'Time',min:0.5,max:10,step:0.5,default:2,unit:'hrs'}
    ], formulas:[ {label:'Average speed = distance ÷ time', fn:v=>v.dist/v.time, unit:'km/h'} ]}},
  {code:'m', title:'Percentages', content:['Simple interest, commission, discount, depreciation', 'Profit and loss, compound interest, hire purchase, percentage error'], notes:'Compound interest limited to a maximum of 3 years.',
   sim:{engine:'calcSliders', canvas:{w:420,h:200}, vars:[

/* ======================================================================
   SIM ENGINE HELPERS
   ====================================================================== */
function $el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function fmt(n, d=2){ if(typeof n!=='number' || !isFinite(n)) return String(n); const f=Math.pow(10,d); return (Math.round(n*f)/f).toString(); }

function simSlider(container,{label,min,max,step,value,unit='',onInput}){
  const wrap=$el('div','sim-field');
  const lab=$el('div','sim-label');
  const valSpan=$el('span','sim-val'); valSpan.textContent=fmt(value, step<1?2:0);
  lab.appendChild(document.createTextNode(label+': '));
  lab.appendChild(valSpan);
  if(unit) lab.appendChild(document.createTextNode(' '+unit));
  const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=value;
  inp.addEventListener('input', ()=>{ const v=parseFloat(inp.value); valSpan.textContent=fmt(v, step<1?2:0); onInput(v); });
  wrap.appendChild(lab); wrap.appendChild(inp); container.appendChild(wrap);
  return { get value(){return parseFloat(inp.value);} };
}
function simSelect(container,{label,options,value,onChange}){
  const wrap=$el('div','sim-field');
  if(label){ const lab=$el('div','sim-label'); lab.textContent=label; wrap.appendChild(lab); }
  const sel=document.createElement('select'); sel.className='sim-select';
  options.forEach(o=>{ const op=document.createElement('option'); op.value=o.value; op.textContent=o.label; if(String(o.value)===String(value)) op.selected=true; sel.appendChild(op); });
  sel.addEventListener('change', ()=>onChange(sel.value));
  wrap.appendChild(sel); container.appendChild(wrap);
  return { get value(){return sel.value;} };
}
function simButton(container,label,onClick){
  const b=document.createElement('button'); b.className='sim-btn'; b.type='button'; b.textContent=label;
  b.addEventListener('click',onClick); container.appendChild(b); return b;
}
function simResult(container){ const r=$el('div','sim-result'); container.appendChild(r); return r; }
function simCanvas(container,w,h){
  const wrap=$el('div','sim-canvas-wrap');
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.className='sim-canvas';
  wrap.appendChild(c); container.appendChild(wrap);
  return c.getContext('2d');
}
function drawCartesian(ctx,{xMin,xMax,yMin,yMax,step=1}){
  const w=ctx.canvas.width,h=ctx.canvas.height;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const X=x=>(x-xMin)/(xMax-xMin)*w;
  const Y=y=>h-(y-yMin)/(yMax-yMin)*h;
  ctx.strokeStyle='#E9EBF0'; ctx.lineWidth=1;
  for(let x=Math.ceil(xMin/step)*step; x<=xMax; x+=step){ ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),h); ctx.stroke(); }
  for(let y=Math.ceil(yMin/step)*step; y<=yMax; y+=step){ ctx.beginPath(); ctx.moveTo(0,Y(y)); ctx.lineTo(w,Y(y)); ctx.stroke(); }
  ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(w,Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(0),0); ctx.lineTo(X(0),h); ctx.stroke();
  return {X,Y};
}

/* ---------- calcSliders ---------- */
function initCalcSliders(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const vals={}; sim.vars.forEach(v=>{ vals[v.key]=v.default; });
  let ctx=null;
  if(sim.canvas || sim.draw){ ctx = simCanvas(container, (sim.canvas&&sim.canvas.w)||420, (sim.canvas&&sim.canvas.h)||220); }
  const resultBox = simResult(container);
  function update(){
    if(ctx && sim.draw) sim.draw(ctx, vals);
    resultBox.innerHTML = sim.formulas.map(f=>{
      const r=f.fn(vals);
      const val = typeof r==='string' ? r : fmt(r, f.decimals ?? 2);
      return `<div class="sim-result-row"><span class="sim-result-label">${f.label}</span><span class="sim-result-value">${val}${f.unit?(' '+f.unit):''}</span></div>`;
    }).join('');
  }
  sim.vars.forEach(v=>{
    simSlider(controls, {label:v.label, min:v.min, max:v.max, step:v.step, value:v.default, unit:v.unit,
      onInput:(val)=>{ vals[v.key]=val; update(); }});
  });
  update();
}

/* ---------- graphPlot (multi-mode) ---------- */
function initGraphPlot(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const ctx = simCanvas(container, 440, 280);
  const resultBox = simResult(container);
  const p={};
  function draw(){
    const range = sim.range || {xMin:-10,xMax:10,yMin:-10,yMax:10,step:2};
    const {X,Y} = drawCartesian(ctx, range);
    ctx.lineWidth=2;

    if(sim.mode==='quadratic'){
      const a=p.a,b=p.b,c=p.c;
      ctx.strokeStyle='#B5322F'; ctx.beginPath();
      for(let px=0; px<=ctx.canvas.width; px++){
        const x = range.xMin + (px/ctx.canvas.width)*(range.xMax-range.xMin);
        const y = a*x*x+b*x+c; const py=Y(y);
        if(px===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const disc = b*b-4*a*c;
      let rootsTxt='no real roots';
      if(a!==0 && disc>=0){
        const r1=(-b+Math.sqrt(disc))/(2*a), r2=(-b-Math.sqrt(disc))/(2*a);
        [r1,r2].forEach(r=>{ ctx.fillStyle='#1D7A63'; ctx.beginPath(); ctx.arc(X(r),Y(0),4,0,7); ctx.fill(); });
        rootsTxt = disc===0 ? `x = ${fmt(r1)}` : `x = ${fmt(r1)} or x = ${fmt(r2)}`;
      }
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Discriminant b² − 4ac</span><span class="sim-result-value">${fmt(disc)}</span></div><div class="sim-result-row"><span class="sim-result-label">Roots</span><span class="sim-result-value">${rootsTxt}</span></div>`;
    }
    else if(sim.mode==='twoLines'){
      [['line1_m','line1_c','#B5322F'],['line2_m','line2_c','#1D7A63']].forEach(([mk,ck,col])=>{
        const m=p[mk], c=p[ck];
        ctx.strokeStyle=col; ctx.beginPath();
        ctx.moveTo(X(range.xMin),Y(m*range.xMin+c)); ctx.lineTo(X(range.xMax),Y(m*range.xMax+c)); ctx.stroke();
      });
      const m1=p.line1_m,c1=p.line1_c,m2=p.line2_m,c2=p.line2_c;
      let txt;
      if(m1===m2){ txt = c1===c2 ? 'Lines coincide (infinite solutions)' : 'Lines are parallel (no solution)'; }
      else{ const x=(c2-c1)/(m1-m2), y=m1*x+c1; ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(X(x),Y(y),5,0,7); ctx.fill(); txt=`x = ${fmt(x)}, y = ${fmt(y)}`; }
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Solution</span><span class="sim-result-value">${txt}</span></div>`;
    }
    else if(sim.mode==='tangent'){
      const fn=x=>x*x-2*x-3, dfn=x=>2*x-2;
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath();
      for(let px=0; px<=ctx.canvas.width; px++){
        const x=range.xMin+(px/ctx.canvas.width)*(range.xMax-range.xMin); const py=Y(fn(x));
        if(px===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const x0=p.x0, y0=fn(x0), grad=dfn(x0);
      ctx.strokeStyle='#B5322F'; ctx.beginPath();
      const xa=x0-3, xb=x0+3;
      ctx.moveTo(X(xa), Y(y0+grad*(xa-x0))); ctx.lineTo(X(xb), Y(y0+grad*(xb-x0))); ctx.stroke();
      ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(X(x0),Y(y0),5,0,7); ctx.fill();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">f(x) = x² − 2x − 3</span><span class="sim-result-value">f(${fmt(x0)}) = ${fmt(y0)}</span></div><div class="sim-result-row"><span class="sim-result-label">Gradient (dy/dx = 2x − 2)</span><span class="sim-result-value">${fmt(grad)}</span></div>`;
    }
    else if(sim.mode==='inequality'){
      const m=p.m,c=p.c, dir=p.dir_str||'>=';
      ctx.save(); ctx.beginPath();
      const x1=range.xMin,x2=range.xMax;
      const yTop = dir.includes('>') ? range.yMax : range.yMin;
      ctx.moveTo(X(x1), Y(m*x1+c)); ctx.lineTo(X(x2), Y(m*x2+c)); ctx.lineTo(X(x2), Y(yTop)); ctx.lineTo(X(x1), Y(yTop)); ctx.closePath();
      ctx.fillStyle='rgba(217,164,65,.28)'; ctx.fill(); ctx.restore();
      ctx.strokeStyle='#1B2A4A'; ctx.setLineDash(dir.includes('=')?[]:[6,4]);
      ctx.beginPath(); ctx.moveTo(X(x1),Y(m*x1+c)); ctx.lineTo(X(x2),Y(m*x2+c)); ctx.stroke(); ctx.setLineDash([]);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Region</span><span class="sim-result-value">y ${dir} ${fmt(m)}x + ${fmt(c)}</span></div>`;
    }
    else if(sim.mode==='variation'){
      const k=p.k, type=p.type_str||'direct';
      ctx.strokeStyle='#B5322F'; ctx.beginPath(); let started=false;
      for(let px=0; px<=ctx.canvas.width; px++){
        const x=range.xMin+(px/ctx.canvas.width)*(range.xMax-range.xMin);
        let y;
        if(type==='direct'){ y=k*x; }
        else { if(Math.abs(x)<0.4){ started=false; continue; } y=k/x; }
        const py=Y(y);
        if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
      }
      ctx.stroke();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">${type==='direct'?'y = kx':'y = k/x'}</span><span class="sim-result-value">k = ${fmt(k)}</span></div>`;
    }
    else if(sim.mode==='unitCircle'){
      const theta=p.theta*Math.PI/180;
      const r=Math.min(ctx.canvas.width,ctx.canvas.height)/2-30;
      const cx=ctx.canvas.width/2, cy=ctx.canvas.height/2;
      ctx.strokeStyle='#D8DCE3'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
      const px=cx+r*Math.cos(theta), py=cy-r*Math.sin(theta);
      ctx.strokeStyle='#B5322F'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
      ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">sin ${Math.round(p.theta)}°</span><span class="sim-result-value">${fmt(Math.sin(theta),3)}</span></div><div class="sim-result-row"><span class="sim-result-label">cos ${Math.round(p.theta)}°</span><span class="sim-result-value">${fmt(Math.cos(theta),3)}</span></div><div class="sim-result-row"><span class="sim-result-label">tan ${Math.round(p.theta)}°</span><span class="sim-result-value">${fmt(Math.tan(theta),3)}</span></div>`;
    }
    else if(sim.mode==='derivative'){
      const n=parseInt(p.n_str||'2');
      const fn=x=>Math.pow(x,n), dfn=x=>n*Math.pow(x,n-1);
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath();
      for(let px=0;px<=ctx.canvas.width;px++){
        const x=range.xMin+(px/ctx.canvas.width)*(range.xMax-range.xMin); const py=Y(fn(x));
        if(px===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const x0=p.x0, y0=fn(x0), grad=dfn(x0);
      ctx.strokeStyle='#B5322F'; ctx.beginPath();
      ctx.moveTo(X(x0-2), Y(y0-grad*2)); ctx.lineTo(X(x0+2), Y(y0+grad*2)); ctx.stroke();
      ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(X(x0),Y(y0),5,0,7); ctx.fill();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">y = x^${n}, dy/dx = ${n}x^${n-1}</span><span class="sim-result-value">—</span></div><div class="sim-result-row"><span class="sim-result-label">Gradient at x = ${fmt(x0)}</span><span class="sim-result-value">${fmt(grad)}</span></div>`;
    }
    else if(sim.mode==='integral'){
      const fn=x=>x*x, F=x=>x*x*x/3;
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath();
      for(let px=0;px<=ctx.canvas.width;px++){
        const x=range.xMin+(px/ctx.canvas.width)*(range.xMax-range.xMin); const py=Y(fn(x));
        if(px===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const a=Math.min(p.a,p.b), b=Math.max(p.a,p.b);
      ctx.beginPath(); ctx.moveTo(X(a),Y(0));
      for(let x=a;x<=b;x+=(b-a)/60||1){ ctx.lineTo(X(x),Y(fn(x))); }
      ctx.lineTo(X(b),Y(0)); ctx.closePath();
      ctx.fillStyle='rgba(29,122,99,.28)'; ctx.fill();
      const area=F(b)-F(a);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">∫ x² dx from ${fmt(a)} to ${fmt(b)}</span><span class="sim-result-value">${fmt(area)}</span></div>`;
    }
  }
  (sim.params||[]).forEach(v=>{
    if(v.type==='select'){
      p[v.key+'_str']=v.default;
      simSelect(controls,{label:v.label, options:v.options, value:v.default, onChange:(val)=>{ p[v.key+'_str']=val; draw(); }});
    } else {
      p[v.key]=v.default;
      simSlider(controls,{label:v.label,min:v.min,max:v.max,step:v.step,value:v.default,unit:v.unit,onInput:(val)=>{ p[v.key]=val; draw(); }});
    }
  });
  draw();
}

/* ---------- venn3 (Sets) ---------- */
function initVenn3(container){
  const wrap=$el('div','sim-controls'); container.appendChild(wrap);
  const ops=[
    {label:'A ∪ B', fn:e=>e.inA||e.inB},
    {label:'A ∩ B', fn:e=>e.inA&&e.inB},
    {label:"A′ (complement)", fn:e=>!e.inA},
    {label:'A ∩ B ∩ C', fn:e=>e.inA&&e.inB&&e.inC},
    {label:'B − C', fn:e=>e.inB&&!e.inC},
  ];
  let current=ops[1];
  simSelect(wrap,{label:'Operation', options:ops.map((o,i)=>({value:i,label:o.label})), value:1, onChange:(v)=>{current=ops[+v]; draw();}});
  const ctx=simCanvas(container,420,300);
  const resultBox=simResult(container);
  const elements=[
    {id:1,inA:true,inB:false,inC:false},{id:2,inA:true,inB:false,inC:false},
    {id:3,inA:false,inB:true,inC:false},{id:4,inA:false,inB:true,inC:false},
    {id:5,inA:false,inB:false,inC:true},{id:6,inA:false,inB:false,inC:true},
    {id:7,inA:true,inB:true,inC:false},{id:8,inA:true,inB:false,inC:true},
    {id:9,inA:false,inB:true,inC:true},{id:10,inA:true,inB:true,inC:true},
    {id:11,inA:false,inB:false,inC:false},{id:12,inA:false,inB:false,inC:false},
  ];
  const pos={1:[130,90],2:[110,120],3:[290,90],4:[310,120],5:[210,235],6:[210,262],
    7:[210,90],8:[165,175],9:[255,175],10:[210,150],11:[35,270],12:[385,270]};
  function draw(){
    ctx.clearRect(0,0,420,300); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,300);
    ctx.globalAlpha=.35;
    ctx.fillStyle='#B5322F'; ctx.beginPath(); ctx.arc(170,150,90,0,7); ctx.fill();
    ctx.fillStyle='#1D7A63'; ctx.beginPath(); ctx.arc(250,150,90,0,7); ctx.fill();
    ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(210,210,90,0,7); ctx.fill();
    ctx.globalAlpha=1;
    ctx.font='600 13px IBM Plex Sans'; ctx.fillStyle='#1B2A4A';
    ctx.fillText('A',108,68); ctx.fillText('B',302,68); ctx.fillText('C',203,288);
    elements.forEach(e=>{
      const [x,y]=pos[e.id]; const on=current.fn(e);
      ctx.beginPath(); ctx.arc(x,y,10,0,7);
      ctx.fillStyle= on? '#1B2A4A':'#fff'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle= on?'#1B2A4A':'#9099AC'; ctx.stroke();
      ctx.fillStyle= on?'#fff':'#5B6478'; ctx.font='600 11px JetBrains Mono';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e.id, x, y+1);
    });
    ctx.textAlign='start'; ctx.textBaseline='alphabetic';
    const members=elements.filter(current.fn).map(e=>e.id);
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">${current.label}</span><span class="sim-result-value">{ ${members.join(', ')||'∅'} }</span></div>`;
  }
  draw();
}
