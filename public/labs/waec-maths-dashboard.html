/* ---------- matrixCalc ---------- */
function initMatrixCalc(container){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const grid=$el('div','sim-controls'); controls.appendChild(grid);
  const vals={m1:1,m2:2,m3:3,m4:4,n1:5,n2:6,n3:7,n4:8};
  function makeMatrixInputs(prefix,label){
    const box=$el('div','sim-matrix');
    const lab=$el('div','sim-label'); lab.textContent=label; box.appendChild(lab);
    const g=$el('div','sim-matrix-2x2');
    [1,2,3,4].forEach(i=>{
      const key=prefix+i;
      const inp=document.createElement('input'); inp.type='number'; inp.className='sim-input'; inp.value=vals[key];
      inp.addEventListener('input',()=>{ vals[key]=parseFloat(inp.value)||0; update(); });
      g.appendChild(inp);
    });
    box.appendChild(g); grid.appendChild(box);
  }
  makeMatrixInputs('m','Matrix A');
  makeMatrixInputs('n','Matrix B');
  const opSel = simSelect(controls,{label:'Operation', options:[
    {value:'add',label:'A + B'},{value:'sub',label:'A − B'},{value:'mul',label:'A × B'},{value:'det',label:'det(A)'}
  ], value:'add', onChange:update});
  const resultBox=simResult(container);
  function update(){
    const A=[[vals.m1,vals.m2],[vals.m3,vals.m4]];
    const B=[[vals.n1,vals.n2],[vals.n3,vals.n4]];
    const op=opSel.value;
    if(op==='det'){
      const d=A[0][0]*A[1][1]-A[0][1]*A[1][0];
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">det(A)</span><span class="sim-result-value">${fmt(d)}</span></div>`;
      return;
    }
    let out;
    if(op==='add') out=[[A[0][0]+B[0][0],A[0][1]+B[0][1]],[A[1][0]+B[1][0],A[1][1]+B[1][1]]];
    if(op==='sub') out=[[A[0][0]-B[0][0],A[0][1]-B[0][1]],[A[1][0]-B[1][0],A[1][1]-B[1][1]]];
    if(op==='mul') out=[[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
                         [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Result</span><span class="sim-result-value">[ ${fmt(out[0][0])}, ${fmt(out[0][1])} / ${fmt(out[1][0])}, ${fmt(out[1][1])} ]</span></div>`;
  }
  update();
}

/* ---------- sequenceBars ---------- */
function initSequenceBars(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const state={a1:sim.a1||3, d:sim.d||4, n:sim.n||8, type:'AP'};
  simSelect(controls,{label:'Type', options:[{value:'AP',label:'Arithmetic (A.P.)'},{value:'GP',label:'Geometric (G.P.)'}], value:'AP', onChange:v=>{state.type=v; update();}});
  simSlider(controls,{label:'First term (a)', min:1,max:10,step:1,value:state.a1, onInput:v=>{state.a1=v; update();}});
  simSlider(controls,{label:'Common difference/ratio', min:-5,max:5,step:1,value:state.d, onInput:v=>{state.d=v; update();}});
  simSlider(controls,{label:'Terms (n)', min:3,max:12,step:1,value:state.n, onInput:v=>{state.n=v; update();}});
  const ctx=simCanvas(container,440,220);
  const resultBox=simResult(container);
  function update(){
    const terms=[];
    for(let i=0;i<state.n;i++){ terms.push(state.type==='AP'? state.a1+i*state.d : state.a1*Math.pow(state.d,i)); }
    const max=Math.max(...terms.map(Math.abs),1);
    ctx.clearRect(0,0,440,220); ctx.fillStyle='#fff'; ctx.fillRect(0,0,440,220);
    const bw=440/terms.length;
    terms.forEach((t,i)=>{
      const h=Math.min(150, Math.abs(t)/max*150);
      ctx.fillStyle= t>=0 ? '#1D7A63':'#B5322F';
      ctx.fillRect(i*bw+6, 170-h, bw-12, h);
      ctx.fillStyle='#1B2A4A'; ctx.font='10px JetBrains Mono'; ctx.textAlign='center';
      ctx.fillText(fmt(t,1), i*bw+bw/2, 185);
      ctx.fillText('U'+(i+1), i*bw+bw/2, 200);
    });
    ctx.textAlign='start';
    const nth = state.type==='AP' ? `Uₙ = a + (n−1)d = ${state.a1} + (n−1)(${state.d})` : `Uₙ = ar⁽ⁿ⁻¹⁾ = ${state.a1} × ${state.d}⁽ⁿ⁻¹⁾`;
    let sumTxt='';
    if(state.type==='AP'){
      const s=state.n/2*(2*state.a1+(state.n-1)*state.d);
      sumTxt = `<div class="sim-result-row"><span class="sim-result-label">Sum of ${state.n} terms</span><span class="sim-result-value">${fmt(s)}</span></div>`;
    }
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">nth term</span><span class="sim-result-value">${nth}</span></div>${sumTxt}`;
  }
  update();
}

/* ---------- baseConverter ---------- */
function initBaseConverter(container){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const state={dec:156, base:2};
  const wrap=$el('div','sim-field'); const lab=$el('div','sim-label'); lab.textContent='Decimal number';
  const numInp=document.createElement('input'); numInp.type='number'; numInp.className='sim-input'; numInp.value=state.dec; numInp.min=0; numInp.max=100000;
  wrap.append(lab,numInp); controls.appendChild(wrap);
  numInp.addEventListener('input',()=>{ state.dec=parseInt(numInp.value)||0; update(); });
  simSelect(controls,{label:'Convert to base', options:[2,3,5,8,16].map(b=>({value:b,label:'Base '+b})), value:2, onChange:v=>{state.base=+v; update();}});
  const resultBox=simResult(container);
  function toBase(n,b){
    if(n===0) return {digits:['0'], steps:[]};
    const digitsChars='0123456789ABCDEF';
    let steps=[], x=n, digits=[];
    while(x>0){ const r=x%b; steps.push(`${x} \u00F7 ${b} = ${Math.floor(x/b)} remainder ${r}`); digits.unshift(digitsChars[r]); x=Math.floor(x/b); }
    return {digits, steps};
  }
  function update(){
    const {digits, steps} = toBase(state.dec, state.base);
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">${state.dec} (base 10) in base ${state.base}</span><span class="sim-result-value">${digits.join('')}</span></div>
      <div class="sim-steps">${steps.map(s=>`<div>${s}</div>`).join('')}</div>`;
  }
  update();
}

/* ---------- moduloClock ---------- */
function initModuloClock(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const state={a:sim.a||6,b:sim.b||4,n:sim.n||7,op:'+'};
  simSlider(controls,{label:'a',min:0,max:20,step:1,value:state.a,onInput:v=>{state.a=v;update();}});
  simSelect(controls,{label:'Operation', options:[{value:'+',label:'+'},{value:'-',label:'\u2212'},{value:'\u00D7',label:'\u00D7'}], value:'+', onChange:v=>{state.op=v; update();}});
  simSlider(controls,{label:'b',min:0,max:20,step:1,value:state.b,onInput:v=>{state.b=v;update();}});
  simSlider(controls,{label:'modulus n',min:2,max:16,step:1,value:state.n,onInput:v=>{state.n=v;update();}});
  const ctx=simCanvas(container,300,300);
  const resultBox=simResult(container);
  function update(){
    let raw;
    if(state.op==='+') raw=state.a+state.b; else if(state.op==='-') raw=state.a-state.b; else raw=state.a*state.b;
    const m = ((raw % state.n)+state.n)%state.n;
    ctx.clearRect(0,0,300,300); ctx.fillStyle='#fff'; ctx.fillRect(0,0,300,300);
    const cx=150,cy=150,r=105;
    ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
    for(let i=0;i<state.n;i++){
      const ang=-Math.PI/2+i*2*Math.PI/state.n;
      const x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
      ctx.fillStyle= i===m?'#B5322F':'#1B2A4A';
      ctx.beginPath(); ctx.arc(x,y, i===m?9:5,0,7); ctx.fill();
      ctx.font='11px JetBrains Mono'; ctx.fillStyle='#1B2A4A'; ctx.textAlign='center';
      ctx.fillText(i, cx+(r+18)*Math.cos(ang), cy+(r+18)*Math.sin(ang)+4);
    }
    ctx.textAlign='start';
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">${state.a} ${state.op} ${state.b} (mod ${state.n})</span><span class="sim-result-value">${m}</span></div>`;
  }
  update();
}

/* ---------- shapeCalc ---------- */
function initShapeCalc(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const ctx=simCanvas(container,420,260);
  const resultBox=simResult(container);
  if(sim.mode==='pythagoras'){
    const st={a:6,b:8};
    simSlider(controls,{label:'a',min:1,max:20,step:1,value:st.a,onInput:v=>{st.a=v;update();}});
    simSlider(controls,{label:'b',min:1,max:20,step:1,value:st.b,onInput:v=>{st.b=v;update();}});
    function update(){
      const c=Math.sqrt(st.a*st.a+st.b*st.b);
      ctx.clearRect(0,0,420,260); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,260);
      const ox=70,oy=220, scale=Math.min(280/st.a,150/st.b);
      const ax=ox+st.a*scale, ay=oy, bx=ox, by=oy-st.b*scale;
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ax,ay); ctx.lineTo(bx,by); ctx.closePath(); ctx.stroke();
      ctx.fillStyle='#1B2A4A'; ctx.font='12px JetBrains Mono';
      ctx.fillText('a = '+fmt(st.a), (ox+ax)/2-14, oy+18);
      ctx.fillText('b = '+fmt(st.b), ox-46, (oy+by)/2);
      ctx.fillStyle='#B5322F'; ctx.fillText('c = '+fmt(c), (ax+bx)/2+8, (ay+by)/2-8);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">c = \u221A(a\u00B2 + b\u00B2)</span><span class="sim-result-value">${fmt(c)}</span></div>`;
    }
    update();
  } else if(sim.mode==='area'){
    const st={shape:'triangle', p1:8,p2:5,p3:4};
    simSelect(controls,{label:'Shape', options:[{value:'triangle',label:'Triangle'},{value:'circle',label:'Circle'},{value:'trapezium',label:'Trapezium'}], value:'triangle', onChange:v=>{st.shape=v; update();}});
    simSlider(controls,{label:'Base / radius (p1)',min:1,max:20,step:1,value:st.p1,onInput:v=>{st.p1=v; update();}});
    simSlider(controls,{label:'Height (p2)',min:1,max:20,step:1,value:st.p2,onInput:v=>{st.p2=v; update();}});
    simSlider(controls,{label:'Top side — trapezium only (p3)',min:1,max:20,step:1,value:st.p3,onInput:v=>{st.p3=v; update();}});
    function update(){
      ctx.clearRect(0,0,420,260); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,260);
      let area, label;
      ctx.strokeStyle='#1B2A4A'; ctx.fillStyle='rgba(217,164,65,.28)'; ctx.lineWidth=2;
      if(st.shape==='triangle'){
        area=0.5*st.p1*st.p2; label='\u00BD \u00D7 base \u00D7 height';
        const scale=Math.min(300/st.p1,160/st.p2), ox=60,oy=220;
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+st.p1*scale,oy); ctx.lineTo(ox+st.p1*scale/2, oy-st.p2*scale); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else if(st.shape==='circle'){
        area=Math.PI*st.p1*st.p1; label='\u03C0r\u00B2';
        const scale=Math.min(1, 110/st.p1);
        ctx.beginPath(); ctx.arc(210,140, st.p1*scale,0,7); ctx.fill(); ctx.stroke();
      } else {
        area=0.5*(st.p1+st.p3)*st.p2; label='\u00BD(a + c) \u00D7 h';
        const scale=Math.min(140/Math.max(st.p1,st.p3), 120/st.p2), ox=80,oy=210;
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+st.p1*scale,oy);
        ctx.lineTo(ox+st.p1*scale-((st.p1-st.p3)/2)*scale, oy-st.p2*scale);
        ctx.lineTo(ox+((st.p1-st.p3)/2)*scale, oy-st.p2*scale); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Area = ${label}</span><span class="sim-result-value">${fmt(area)} sq units</span></div>`;
    }
    update();
  } else if(sim.mode==='volume'){
    const st={shape:'cube', a:5, h:8};
    simSelect(controls,{label:'Solid', options:[{value:'cube',label:'Cube'},{value:'cuboid',label:'Cuboid'},{value:'cylinder',label:'Cylinder'},{value:'cone',label:'Cone'},{value:'sphere',label:'Sphere'}], value:'cube', onChange:v=>{st.shape=v; update();}});
    simSlider(controls,{label:'a / radius',min:1,max:15,step:1,value:st.a,onInput:v=>{st.a=v; update();}});
    simSlider(controls,{label:'height (where applicable)',min:1,max:20,step:1,value:st.h,onInput:v=>{st.h=v; update();}});
    function update(){
      ctx.clearRect(0,0,420,260); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,260);
      let vol,label; const ox=140,oy=200, scale=7;
      ctx.strokeStyle='#1B2A4A'; ctx.fillStyle='rgba(29,122,99,.22)'; ctx.lineWidth=2;
      if(st.shape==='cube'){ vol=Math.pow(st.a,3); label='a\u00B3'; const s=st.a*scale; ctx.strokeRect(ox,oy-s,s,s); ctx.fillRect(ox,oy-s,s,s); }
      else if(st.shape==='cuboid'){ vol=st.a*st.a*st.h; label='l \u00D7 w \u00D7 h'; const w=st.a*scale,h=st.h*scale; ctx.strokeRect(ox,oy-h,w,h); ctx.fillRect(ox,oy-h,w,h); }
      else if(st.shape==='cylinder'){ vol=Math.PI*st.a*st.a*st.h; label='\u03C0r\u00B2h'; const w=st.a*scale*1.4,h=st.h*scale; ctx.strokeRect(ox,oy-h,w,h); ctx.fillRect(ox,oy-h,w,h); ctx.beginPath(); ctx.ellipse(ox+w/2, oy-h, w/2, 8, 0,0,7); ctx.stroke(); }
      else if(st.shape==='cone'){ vol=(1/3)*Math.PI*st.a*st.a*st.h; label='\u2153\u03C0r\u00B2h'; const w=st.a*scale*1.4,h=st.h*scale; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+w,oy); ctx.lineTo(ox+w/2,oy-h); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      else { vol=(4/3)*Math.PI*Math.pow(st.a,3); label='4/3 \u03C0r\u00B3'; const rr=Math.min(st.a*scale/2,90); ctx.beginPath(); ctx.arc(ox+80, oy-90, rr,0,7); ctx.fill(); ctx.stroke(); }
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Volume = ${label}</span><span class="sim-result-value">${fmt(vol)} cubic units</span></div>`;
    }
    update();
  }
}

/* ---------- angleDiagram ---------- */
function initAngleDiagram(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const ctx=simCanvas(container,420,280);
  const resultBox=simResult(container);
  if(sim.mode==='point'){
    let theta=120;
    simSlider(controls,{label:'\u03B8',min:5,max:355,step:1,value:theta,unit:'\u00B0',onInput:v=>{theta=v;update();}});
    function update(){
      ctx.clearRect(0,0,420,280); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,280);
      const cx=210,cy=150,r=100;
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r,cy); ctx.stroke();
      const rad=theta*Math.PI/180;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*Math.cos(-rad),cy+r*Math.sin(-rad)); ctx.stroke();
      ctx.strokeStyle='#B5322F'; ctx.beginPath(); ctx.arc(cx,cy,30,-rad,0); ctx.stroke();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">\u03B8</span><span class="sim-result-value">${theta}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Reflex (360 \u2212 \u03B8)</span><span class="sim-result-value">${360-theta}\u00B0</span></div>`;
    }
    update();
  } else if(sim.mode==='parallel'){
    let theta=60;
    simSlider(controls,{label:'Transversal angle \u03B8',min:10,max:170,step:1,value:theta,unit:'\u00B0',onInput:v=>{theta=v;update();}});
    function update(){
      ctx.clearRect(0,0,420,280); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,280);
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(30,100); ctx.lineTo(390,100); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30,200); ctx.lineTo(390,200); ctx.stroke();
      const rad=theta*Math.PI/180, dx=Math.cos(rad)*160, dy=Math.sin(rad)*160;
      ctx.strokeStyle='#B5322F'; ctx.beginPath(); ctx.moveTo(210-dx,150-dy); ctx.lineTo(210+dx,150+dy); ctx.stroke();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Corresponding angle</span><span class="sim-result-value">${theta}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Alternate angle</span><span class="sim-result-value">${theta}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Co-interior (supplementary)</span><span class="sim-result-value">${180-theta}\u00B0</span></div>`;
    }
    update();
  } else if(sim.mode==='polygon'){
    let n=6;
    simSlider(controls,{label:'Sides (n)',min:3,max:12,step:1,value:n,onInput:v=>{n=v;update();}});
    function update(){
      ctx.clearRect(0,0,420,280); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,280);
      const cx=210,cy=150,r=100;
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2; ctx.beginPath();
      for(let i=0;i<=n;i++){ const a=-Math.PI/2+i*2*Math.PI/n; const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.closePath(); ctx.stroke();
      const sum=(n-2)*180, each=sum/n, ext=360/n;
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Interior sum (n\u22122)\u00D7180\u00B0</span><span class="sim-result-value">${sum}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Each interior angle (regular)</span><span class="sim-result-value">${fmt(each)}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Each exterior angle</span><span class="sim-result-value">${fmt(ext)}\u00B0</span></div>`;
    }
    update();
  } else if(sim.mode==='circleTheorem'){
    let theta=100;
    simSlider(controls,{label:'Central angle',min:20,max:300,step:1,value:theta,unit:'\u00B0',onInput:v=>{theta=v;update();}});
    function update(){
      ctx.clearRect(0,0,420,280); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,280);
      const cx=210,cy=150,r=100;
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
      const a1=-Math.PI/2, a2=a1+theta*Math.PI/180;
      const p1=[cx+r*Math.cos(a1),cy+r*Math.sin(a1)];
      const p2=[cx+r*Math.cos(a2),cy+r*Math.sin(a2)];
      const remaining = a2 + (2*Math.PI-theta*Math.PI/180)/2;
      const p3=[cx+r*Math.cos(remaining),cy+r*Math.sin(remaining)];
      ctx.strokeStyle='#B5322F'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p1[0],p1[1]); ctx.moveTo(cx,cy); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
      ctx.strokeStyle='#1D7A63'; ctx.beginPath(); ctx.moveTo(p3[0],p3[1]); ctx.lineTo(p1[0],p1[1]); ctx.moveTo(p3[0],p3[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Angle at centre</span><span class="sim-result-value">${theta}\u00B0</span></div><div class="sim-result-row"><span class="sim-result-label">Angle at circumference</span><span class="sim-result-value">${fmt(theta/2)}\u00B0</span></div>`;
    }
    update();
  }
}

/* ---------- locusCanvas ---------- */
function initLocusCanvas(container){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const modeSel=simSelect(controls,{label:'Locus type', options:[
    {value:'point',label:'Given distance from a point'},
    {value:'twoPoints',label:'Equidistant from two points'},
    {value:'twoLines',label:'Equidistant from two lines'},
    {value:'lineDist',label:'Given distance from a line'},
  ], value:'point', onChange:()=>draw()});
  const dynControls=$el('div','sim-controls'); container.appendChild(dynControls);
  const ctx=simCanvas(container,420,280);
  const resultBox=simResult(container);
  let dist=60;
  simSlider(dynControls,{label:'Distance', min:20,max:150,step:5,value:dist,onInput:v=>{dist=v;draw();}});
  function draw(){
    ctx.clearRect(0,0,420,280); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,280);
    ctx.strokeStyle='#B5322F'; ctx.lineWidth=2;
    const mode=modeSel.value;
    if(mode==='point'){
      ctx.fillStyle='#1B2A4A'; ctx.beginPath(); ctx.arc(210,140,4,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(210,140,dist,0,7); ctx.stroke();
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Locus</span><span class="sim-result-value">A circle of radius ${dist} units centred on the point</span></div>`;
    } else if(mode==='twoPoints'){
      ctx.fillStyle='#1B2A4A';
      ctx.beginPath(); ctx.arc(210-dist,140,4,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(210+dist,140,4,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(210,20); ctx.lineTo(210,260); ctx.stroke();
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Locus</span><span class="sim-result-value">The perpendicular bisector of the line joining the two points</span></div>`;
    } else if(mode==='twoLines'){
      ctx.strokeStyle='#1B2A4A';
      ctx.beginPath(); ctx.moveTo(60,60); ctx.lineTo(360,60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60,60); ctx.lineTo(160,260); ctx.stroke();
      ctx.strokeStyle='#B5322F';
      ctx.beginPath(); ctx.moveTo(60,60); ctx.lineTo(260,240); ctx.stroke();
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Locus</span><span class="sim-result-value">The bisector of the angle between the two lines</span></div>`;
    } else {
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath(); ctx.moveTo(30,180); ctx.lineTo(390,180); ctx.stroke();
      ctx.strokeStyle='#B5322F'; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(30,180-dist); ctx.lineTo(390,180-dist); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30,180+dist); ctx.lineTo(390,180+dist); ctx.stroke();
      ctx.setLineDash([]);
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Locus</span><span class="sim-result-value">Two lines parallel to the given line, each ${dist} units from it</span></div>`;
    }
  }
  draw();
}

/* ---------- coordGrid ---------- */
function initCoordGrid(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const ctx=simCanvas(container,400,400);
  const resultBox=simResult(container);
  const range={xMin:-10,xMax:10,yMin:-10,yMax:10,step:1};
  let XY;
  function redraw(){ XY = drawCartesian(ctx,range); }

  if(sim.mode==='point' || sim.mode==='distance' || sim.mode==='gradient'){
    const nPts = sim.mode==='point'?1:2;
    const pts=[{x:3,y:4},{x:-3,y:-2}].slice(0,nPts);
    let dragIdx=-1;
    const hint=$el('div','sim-hint'); hint.textContent='Drag the point(s) on the grid.'; container.insertBefore(hint, ctx.canvas.parentElement);
    function draw(){
      redraw();
      pts.forEach((pt,i)=>{
        const px=XY.X(pt.x), py=XY.Y(pt.y);
        ctx.fillStyle='#B5322F'; ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill();
        ctx.font='12px JetBrains Mono'; ctx.fillStyle='#1B2A4A';
        ctx.fillText(`(${fmt(pt.x,1)}, ${fmt(pt.y,1)})`, px+8, py-8);
      });
      if(nPts===2){
        ctx.strokeStyle='#1D7A63'; ctx.beginPath();
        ctx.moveTo(XY.X(pts[0].x),XY.Y(pts[0].y)); ctx.lineTo(XY.X(pts[1].x),XY.Y(pts[1].y)); ctx.stroke();
      }
      if(sim.mode==='point'){
        resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Point</span><span class="sim-result-value">(${fmt(pts[0].x,1)}, ${fmt(pts[0].y,1)})</span></div>`;
      } else if(sim.mode==='distance'){
        const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
        const d=Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
        resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Midpoint</span><span class="sim-result-value">(${fmt(mx)}, ${fmt(my)})</span></div><div class="sim-result-row"><span class="sim-result-label">Distance |PQ|</span><span class="sim-result-value">${fmt(d)}</span></div>`;
      } else {
        const denom=(pts[1].x-pts[0].x)||0.0001;
        const m=(pts[1].y-pts[0].y)/denom;
        resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Gradient m</span><span class="sim-result-value">${fmt(m)}</span></div>`;
      }
    }
    const canvas=ctx.canvas;
    function getMouse(e){
      const r=canvas.getBoundingClientRect();
      const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
      return {mx:(cx-r.left)*(canvas.width/r.width), my:(cy-r.top)*(canvas.height/r.height)};
    }
    canvas.addEventListener('mousedown', e=>{ const {mx,my}=getMouse(e); pts.forEach((pt,i)=>{ if(Math.hypot(XY.X(pt.x)-mx, XY.Y(pt.y)-my)<14) dragIdx=i; }); });
    window.addEventListener('mouseup', ()=>dragIdx=-1);
    canvas.addEventListener('mousemove', e=>{
      if(dragIdx===-1) return;
      const {mx,my}=getMouse(e);
      const gx=Math.round((range.xMin + mx/canvas.width*(range.xMax-range.xMin))*2)/2;
      const gy=Math.round((range.yMin + (canvas.height-my)/canvas.height*(range.yMax-range.yMin))*2)/2;
      pts[dragIdx]={x:gx,y:gy}; draw();
    });
    draw();
  } else if(sim.mode==='line'){
    let m=1,c=0;
    simSlider(controls,{label:'m (gradient)',min:-5,max:5,step:0.5,value:1,onInput:v=>{m=v;draw();}});
    simSlider(controls,{label:'c (intercept)',min:-8,max:8,step:1,value:0,onInput:v=>{c=v;draw();}});
    function draw(){
      redraw();
      ctx.strokeStyle='#B5322F'; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(XY.X(range.xMin), XY.Y(m*range.xMin+c));
      ctx.lineTo(XY.X(range.xMax), XY.Y(m*range.xMax+c));
      ctx.stroke();
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">Equation</span><span class="sim-result-value">y = ${fmt(m)}x ${c>=0?'+':'\u2212'} ${fmt(Math.abs(c))}</span></div>`;
    }
    draw();
  } else if(sim.mode==='vectors'){
    let v1={x:4,y:2}, v2={x:1,y:3};
    simSlider(controls,{label:'Vector u \u2014 x',min:-8,max:8,step:1,value:v1.x,onInput:v=>{v1.x=v;draw();}});
    simSlider(controls,{label:'Vector u \u2014 y',min:-8,max:8,step:1,value:v1.y,onInput:v=>{v1.y=v;draw();}});
    simSlider(controls,{label:'Vector v \u2014 x',min:-8,max:8,step:1,value:v2.x,onInput:v=>{v2.x=v;draw();}});
    simSlider(controls,{label:'Vector v \u2014 y',min:-8,max:8,step:1,value:v2.y,onInput:v=>{v2.y=v;draw();}});
    function arrow(from,to,color){
      ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(from[0],from[1]); ctx.lineTo(to[0],to[1]); ctx.stroke();
      const ang=Math.atan2(to[1]-from[1],to[0]-from[0]);
      ctx.beginPath(); ctx.moveTo(to[0],to[1]);
      ctx.lineTo(to[0]-10*Math.cos(ang-0.3), to[1]-10*Math.sin(ang-0.3));
      ctx.lineTo(to[0]-10*Math.cos(ang+0.3), to[1]-10*Math.sin(ang+0.3));
      ctx.closePath(); ctx.fill();
    }
    function draw(){
      redraw();
      const O=[XY.X(0),XY.Y(0)];
      arrow(O,[XY.X(v1.x),XY.Y(v1.y)],'#B5322F');
      arrow(O,[XY.X(v2.x),XY.Y(v2.y)],'#1D7A63');
      const sum={x:v1.x+v2.x,y:v1.y+v2.y};
      arrow(O,[XY.X(sum.x),XY.Y(sum.y)],'#D9A441');
      const mag=Math.hypot(v1.x,v1.y);
      resultBox.innerHTML=`<div class="sim-result-row"><span class="sim-result-label">u + v</span><span class="sim-result-value">(${fmt(sum.x)}, ${fmt(sum.y)})</span></div><div class="sim-result-row"><span class="sim-result-label">|u|</span><span class="sim-result-value">${fmt(mag)}</span></div>`;
    }
    draw();
  } else if(sim.mode==='transform'){
    const shape=[{x:1,y:1},{x:4,y:1},{x:2,y:4}];
    let mode='reflectX', tx=2, ty=2, scale=2;
    simSelect(controls,{label:'Transformation', options:[
      {value:'reflectX',label:'Reflect in x-axis'},{value:'reflectY',label:'Reflect in y-axis'},
      {value:'rotate90',label:'Rotate 90\u00B0 about origin'},{value:'rotate180',label:'Rotate 180\u00B0 about origin'},
      {value:'translate',label:'Translate'},{value:'enlarge',label:'Enlarge (centre O)'}
    ], value:'reflectX', onChange:v=>{mode=v; buildSub();}});
    const sub=$el('div','sim-controls'); container.insertBefore(sub, controls.nextSibling);
    function buildSub(){
      sub.innerHTML='';
      if(mode==='translate'){
        simSlider(sub,{label:'tx',min:-6,max:6,step:1,value:tx,onInput:v=>{tx=v;draw();}});
        simSlider(sub,{label:'ty',min:-6,max:6,step:1,value:ty,onInput:v=>{ty=v;draw();}});
      } else if(mode==='enlarge'){
        simSlider(sub,{label:'Scale factor',min:0.5,max:3,step:0.5,value:scale,onInput:v=>{scale=v;draw();}});
      }
      draw();
    }
    function transform(pt){
      if(mode==='reflectX') return {x:pt.x,y:-pt.y};
      if(mode==='reflectY') return {x:-pt.x,y:pt.y};
      if(mode==='rotate90') return {x:-pt.y,y:pt.x};
      if(mode==='rotate180') return {x:-pt.x,y:-pt.y};
      if(mode==='translate') return {x:pt.x+tx,y:pt.y+ty};
      if(mode==='enlarge') return {x:pt.x*scale,y:pt.y*scale};
      return pt;
    }
    function poly(pts,color,fill){
      ctx.strokeStyle=color; ctx.fillStyle=fill; ctx.lineWidth=2; ctx.beginPath();
      pts.forEach((pt,i)=>{ const px=XY.X(pt.x), py=XY.Y(pt.y); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    function draw(){
      redraw();
      poly(shape,'#1B2A4A','rgba(27,42,74,.12)');
      const img=shape.map(transform);
      poly(img,'#B5322F','rgba(181,50,47,.15)');
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Image vertices</span><span class="sim-result-value">${img.map(pt=>`(${fmt(pt.x)}, ${fmt(pt.y)})`).join(', ')}</span></div>`;
    }
    buildSub();
  }
}

/* ---------- statsTool ---------- */
function initStatsTool(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const wrap=$el('div','sim-field'); const lab=$el('div','sim-label'); lab.textContent='Data (comma-separated)';
  const inp=document.createElement('input'); inp.type='text'; inp.className='sim-input-text';
  inp.value = '12, 15, 12, 18, 20, 15, 15, 22, 18, 12';
  wrap.append(lab,inp); controls.appendChild(wrap);
  const needsCanvas = sim.mode==='chart' || sim.mode==='ogive';
  const ctx = needsCanvas ? simCanvas(container,420,240) : null;
  const resultBox=simResult(container);
  function parse(){ return inp.value.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)); }
  function update(){
    const data=parse();
    if(data.length===0){ resultBox.innerHTML='<div class="sim-result-row"><span class="sim-result-label">Enter at least one number.</span></div>'; return; }
    if(sim.mode==='averages'){
      const mean=data.reduce((a,b)=>a+b,0)/data.length;
      const sorted=[...data].sort((a,b)=>a-b);
      const mid=Math.floor(sorted.length/2);
      const median = sorted.length%2? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
      const freq={}; data.forEach(d=>freq[d]=(freq[d]||0)+1);
      const maxF=Math.max(...Object.values(freq));
      const modes=Object.keys(freq).filter(k=>freq[k]===maxF);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Mean</span><span class="sim-result-value">${fmt(mean)}</span></div><div class="sim-result-row"><span class="sim-result-label">Median</span><span class="sim-result-value">${fmt(median)}</span></div><div class="sim-result-row"><span class="sim-result-label">Mode</span><span class="sim-result-value">${modes.join(', ')}</span></div>`;
    } else if(sim.mode==='dispersion'){
      const mean=data.reduce((a,b)=>a+b,0)/data.length;
      const range=Math.max(...data)-Math.min(...data);
      const variance=data.reduce((s,x)=>s+Math.pow(x-mean,2),0)/data.length;
      const sd=Math.sqrt(variance);
      const meanDev=data.reduce((s,x)=>s+Math.abs(x-mean),0)/data.length;
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Range</span><span class="sim-result-value">${fmt(range)}</span></div><div class="sim-result-row"><span class="sim-result-label">Mean deviation</span><span class="sim-result-value">${fmt(meanDev)}</span></div><div class="sim-result-row"><span class="sim-result-label">Variance</span><span class="sim-result-value">${fmt(variance)}</span></div><div class="sim-result-row"><span class="sim-result-label">Standard deviation</span><span class="sim-result-value">${fmt(sd)}</span></div>`;
    } else if(sim.mode==='freqTable'){
      const min=Math.min(...data), max=Math.max(...data);
      const classWidth=Math.max(1,Math.ceil((max-min+1)/5));
      const classes=[];
      for(let start=Math.floor(min); start<=max; start+=classWidth){
        const end=start+classWidth-1;
        classes.push({start,end,count:data.filter(d=>d>=start&&d<=end).length});
      }
      resultBox.innerHTML = `<table class="sim-table"><tr><th>Class interval</th><th>Frequency</th></tr>${classes.map(c=>`<tr><td>${c.start}\u2013${c.end}</td><td>${c.count}</td></tr>`).join('')}</table>`;
    } else if(sim.mode==='chart'){
      const freq={}; data.forEach(d=>freq[d]=(freq[d]||0)+1);
      const keys=Object.keys(freq);
      ctx.clearRect(0,0,420,240); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,240);
      const max=Math.max(...Object.values(freq));
      const bw=380/keys.length;
      keys.forEach((k,i)=>{
        const h=freq[k]/max*180;
        ctx.fillStyle='#1D7A63'; ctx.fillRect(20+i*bw+6, 210-h, bw-12, h);
        ctx.fillStyle='#1B2A4A'; ctx.font='11px JetBrains Mono'; ctx.textAlign='center';
        ctx.fillText(k, 20+i*bw+bw/2, 225);
      });
      ctx.textAlign='start';
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Bar chart</span><span class="sim-result-value">${keys.length} distinct values</span></div>`;
    } else if(sim.mode==='ogive'){
      const sorted=[...data].sort((a,b)=>a-b);
      const min=Math.min(...sorted), max=Math.max(...sorted);
      const classWidth=Math.max(1,Math.ceil((max-min+1)/6));
      const classes=[]; let cum=0;
      for(let start=Math.floor(min); start<=max; start+=classWidth){
        const end=start+classWidth-1;
        cum += sorted.filter(d=>d>=start&&d<=end).length;
        classes.push({end,cum});
      }
      ctx.clearRect(0,0,420,240); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,240);
      ctx.strokeStyle='#B5322F'; ctx.lineWidth=2; ctx.beginPath();
      classes.forEach((c,i)=>{
        const x=30+i*(360/(classes.length-1||1));
        const y=210-(c.cum/data.length)*180;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      classes.forEach((c,i)=>{
        const x=30+i*(360/(classes.length-1||1));
        const y=210-(c.cum/data.length)*180;
        ctx.fillStyle='#1B2A4A'; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();
        ctx.font='10px JetBrains Mono'; ctx.fillText(c.end, x-8, 225);
      });
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Ogive</span><span class="sim-result-value">Cumulative frequency curve, n = ${data.length}</span></div>`;
    }
  }
  inp.addEventListener('input', update);
  update();
}

/* ---------- probabilitySim ---------- */
function initProbabilitySim(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const resultBox=simResult(container);
  if(sim.mode==='trials'){
    let type='die';
    simSelect(controls,{label:'Experiment', options:[{value:'die',label:'Roll a fair die'},{value:'coin',label:'Toss a fair coin'}], value:'die', onChange:v=>{type=v; resultBox.innerHTML='';}});
    simButton(controls, 'Run 60 trials', ()=>{
      const outcomes = type==='die'? [1,2,3,4,5,6] : ['H','T'];
      const tally={};
      for(let i=0;i<60;i++){ const o=outcomes[Math.floor(Math.random()*outcomes.length)]; tally[o]=(tally[o]||0)+1; }
      const theo=1/outcomes.length;
      resultBox.innerHTML = outcomes.map(o=>{
        const exp=(tally[o]||0)/60;
        return `<div class="sim-result-row"><span class="sim-result-label">Outcome ${o}</span><span class="sim-result-value">experimental ${fmt(exp,2)} \u00B7 theoretical ${fmt(theo,2)}</span></div>`;
      }).join('');
    });
  } else if(sim.mode==='addition'){
    let pa=0.3, pb=0.4, exclusive=true;
    simSlider(controls,{label:'P(A)',min:0,max:1,step:0.05,value:pa,onInput:v=>{pa=v;update();}});
    simSlider(controls,{label:'P(B)',min:0,max:1,step:0.05,value:pb,onInput:v=>{pb=v;update();}});
    simSelect(controls,{label:'Relationship', options:[{value:'ex',label:'Mutually exclusive'},{value:'ind',label:'Independent'}], value:'ex', onChange:v=>{exclusive=v==='ex';update();}});
    function update(){
      const pboth = exclusive?0:pa*pb;
      const pOr = pa+pb-pboth;
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">P(A and B)</span><span class="sim-result-value">${fmt(pboth,3)}</span></div><div class="sim-result-row"><span class="sim-result-label">P(A or B)</span><span class="sim-result-value">${fmt(pOr,3)}</span></div>`;
    }
    update();
  } else if(sim.mode==='multiplication'){
    let p1=0.5,p2=0.5;
    simSlider(controls,{label:'P(Event 1)',min:0,max:1,step:0.05,value:p1,onInput:v=>{p1=v;draw();}});
    simSlider(controls,{label:'P(Event 2)',min:0,max:1,step:0.05,value:p2,onInput:v=>{p2=v;draw();}});
    const ctx=simCanvas(container,420,220);
    function draw(){
      ctx.clearRect(0,0,420,220); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,220);
      ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(30,110); ctx.lineTo(160,50); ctx.moveTo(30,110); ctx.lineTo(160,170); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160,50); ctx.lineTo(300,20); ctx.moveTo(160,50); ctx.lineTo(300,80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160,170); ctx.lineTo(300,140); ctx.moveTo(160,170); ctx.lineTo(300,200); ctx.stroke();
      ctx.font='11px JetBrains Mono'; ctx.fillStyle='#1B2A4A';
      ctx.fillText(fmt(p1,2), 85,72); ctx.fillText(fmt(1-p1,2), 85,148);
      ctx.fillText(fmt(p2,2), 220,28); ctx.fillText(fmt(1-p2,2), 220,90);
      ctx.fillStyle='#B5322F'; ctx.fillText('P(1\u22292) = '+fmt(p1*p2,3), 300, 24);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">P(Event 1 AND Event 2)</span><span class="sim-result-value">${fmt(p1*p2,3)}</span></div>`;
    }
    draw();
  }
}

/* ---------- mappingDiagram ---------- */
function initMappingDiagram(container){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const domain=[1,2,3,4];
  let ruleKey='x+1';
  const rules={
    'x+1': {label:'x \u2192 x + 1', fn:x=>[x+1], type:'one-to-one'},
    'x2': {label:'x \u2192 x\u00B2', fn:x=>[x*x], type:'many-to-one'},
    'sqrt': {label:'x \u2192 \u00B1\u221Ax', fn:x=>x>=0?[Math.sqrt(x),-Math.sqrt(x)]:[], type:'one-to-many'},
    'const': {label:'x \u2192 3', fn:x=>[3], type:'many-to-one'},
  };
  simSelect(controls,{label:'Rule', options:Object.keys(rules).map(k=>({value:k,label:rules[k].label})), value:'x+1', onChange:v=>{ruleKey=v;draw();}});
  const ctx=simCanvas(container,420,240);
  const resultBox=simResult(container);
  function draw(){
    ctx.clearRect(0,0,420,240); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,240);
    const rule=rules[ruleKey];
    const range=new Set();
    domain.forEach(x=>rule.fn(x).forEach(y=>range.add(y)));
    const rangeArr=[...range];
    const dY = x=> 40 + domain.indexOf(x)*45;
    const rY = y=> 40 + rangeArr.indexOf(y)*45;
    ctx.font='13px JetBrains Mono'; ctx.fillStyle='#1B2A4A';
    domain.forEach(x=>{ ctx.beginPath(); ctx.arc(80,dY(x),4,0,7); ctx.fill(); ctx.fillText(x, 55, dY(x)+4); });
    rangeArr.forEach(y=>{ ctx.beginPath(); ctx.arc(340,rY(y),4,0,7); ctx.fill(); ctx.fillText(fmt(y,1), 355, rY(y)+4); });
    ctx.strokeStyle='#B5322F'; ctx.lineWidth=1.5;
    domain.forEach(x=>{ rule.fn(x).forEach(y=>{ ctx.beginPath(); ctx.moveTo(84,dY(x)); ctx.lineTo(336,rY(y)); ctx.stroke(); }); });
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Mapping type</span><span class="sim-result-value">${rule.type}</span></div>`;
  }
  draw();
}

/* ---------- constructionSteps ---------- */
function initConstructionSteps(container){
  const ctx=simCanvas(container,360,260);
  const resultBox=simResult(container);
  const nav=$el('div','sim-controls'); container.appendChild(nav);
  const steps=[
    'Draw angle ABC with vertex B.',
    'With centre B, draw an arc crossing both arms at P and Q.',
    'With centre P (radius > half PQ), draw an arc between the arms.',
    'With the same radius, centre Q, draw an arc to intersect the previous one at R.',
    'Draw the straight line BR — this bisects angle ABC.',
  ];
  let step=0;
  simButton(nav,'\u25C0 Prev', ()=>{ step=Math.max(0,step-1); draw(); });
  simButton(nav,'Next \u25B6', ()=>{ step=Math.min(steps.length-1,step+1); draw(); });
  function draw(){
    ctx.clearRect(0,0,360,260); ctx.fillStyle='#fff'; ctx.fillRect(0,0,360,260);
    const B=[60,220], C=[300,220], A=[100,40];
    ctx.strokeStyle='#1B2A4A'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(B[0],B[1]); ctx.lineTo(A[0],A[1]); ctx.stroke();
    if(step>=1){ ctx.strokeStyle='#1D7A63'; ctx.beginPath(); ctx.arc(B[0],B[1],60,-0.9,0.05); ctx.stroke(); }
    if(step>=2){ ctx.strokeStyle='#D9A441'; ctx.beginPath(); ctx.arc(120,208,55,0,7); ctx.stroke(); }
    if(step>=3){ ctx.strokeStyle='#D9A441'; ctx.beginPath(); ctx.arc(178,150,55,0,7); ctx.stroke(); }
    if(step>=4){ ctx.strokeStyle='#B5322F'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(B[0],B[1]); ctx.lineTo(210,80); ctx.stroke(); }
    resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Step ${step+1} / ${steps.length}</span><span class="sim-result-value">${steps[step]}</span></div>`;
  }
  draw();
}

/* ---------- numberLine ---------- */
function initNumberLine(container, sim){
  const controls=$el('div','sim-controls'); container.appendChild(controls);
  const ctx=simCanvas(container,420,120);
  const resultBox=simResult(container);
  if(sim.mode==='rounding'){
    let val=47.5821, dp=2;
    simSlider(controls,{label:'Number',min:0,max:100,step:0.0001,value:val,onInput:v=>{val=v;draw();}});
    simSlider(controls,{label:'Decimal places',min:0,max:4,step:1,value:dp,onInput:v=>{dp=v;draw();}});
    function draw(){
      ctx.clearRect(0,0,420,120); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,120);
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath(); ctx.moveTo(20,60); ctx.lineTo(400,60); ctx.stroke();
      const lo=Math.floor(val)-1, hi=Math.ceil(val)+1;
      ctx.font='11px JetBrains Mono'; ctx.fillStyle='#1B2A4A';
      for(let i=lo;i<=hi;i++){ const x=20+(i-lo)/(hi-lo)*380; ctx.beginPath(); ctx.moveTo(x,55); ctx.lineTo(x,65); ctx.stroke(); ctx.fillText(i, x-6, 80); }
      const x=20+(val-lo)/(hi-lo)*380;
      ctx.fillStyle='#B5322F'; ctx.beginPath(); ctx.arc(x,60,5,0,7); ctx.fill();
      const rounded = val.toFixed(dp);
      const sig = Number(val.toPrecision(3));
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">To ${dp} d.p.</span><span class="sim-result-value">${rounded}</span></div><div class="sim-result-row"><span class="sim-result-label">To 3 s.f.</span><span class="sim-result-value">${sig}</span></div>`;
    }
    draw();
  } else {
    let val=0.75;
    simSlider(controls,{label:'Point on the number line',min:-3,max:3,step:0.05,value:val,onInput:v=>{val=v;draw();}});
    function gcd(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
    function draw(){
      ctx.clearRect(0,0,420,120); ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,120);
      ctx.strokeStyle='#1B2A4A'; ctx.beginPath(); ctx.moveTo(20,60); ctx.lineTo(400,60); ctx.stroke();
      ctx.font='11px JetBrains Mono'; ctx.fillStyle='#1B2A4A';
      for(let i=-3;i<=3;i++){ const x=210+i*60; ctx.beginPath(); ctx.moveTo(x,55); ctx.lineTo(x,65); ctx.stroke(); ctx.fillText(i,x-3,80); }
      const x=210+val*60;
      ctx.fillStyle='#B5322F'; ctx.beginPath(); ctx.arc(x,60,5,0,7); ctx.fill();
      const denom=20; const num=Math.round(val*denom); const g=gcd(num,denom);
      resultBox.innerHTML = `<div class="sim-result-row"><span class="sim-result-label">Decimal</span><span class="sim-result-value">${fmt(val,2)}</span></div><div class="sim-result-row"><span class="sim-result-label">Approx. fraction</span><span class="sim-result-value">${num/g}/${denom/g}</span></div>`;
    }
    draw();
  }
}

/* ---------- dispatch ---------- */
const SIM_ENGINES = {
  calcSliders: initCalcSliders, graphPlot: initGraphPlot, venn3: initVenn3, truthTable: initTruthTable,
  matrixCalc: initMatrixCalc, sequenceBars: initSequenceBars, baseConverter: initBaseConverter,
  moduloClock: initModuloClock, shapeCalc: initShapeCalc, angleDiagram: initAngleDiagram,
  locusCanvas: initLocusCanvas, coordGrid: initCoordGrid, statsTool: initStatsTool,
  probabilitySim: initProbabilitySim, mappingDiagram: initMappingDiagram,
  constructionSteps: initConstructionSteps, numberLine: initNumberLine,
};
const simLookup = {};
SYLLABUS.forEach(t=> t.subtopics.forEach(st=>{ if(st.sim) simLookup[t.code+'-'+st.code]=st.sim; }));

function ensureMounted(item){
  item.querySelectorAll('.sim-panel').forEach(mountPanel);
}
function mountPanel(panel){
  if(!panel || panel.dataset.mounted) return;
  const key = panel.dataset.key;
  if (window.MK && MK.has(key)) { panel.dataset.mounted='1'; try { MK.mount(panel, key); } catch(err){ panel.innerHTML='<div class="sim-error">This simulation could not load.</div>'; console.error(key, err); } return; }
  const simData = simLookup[key];
  if(!simData || !SIM_ENGINES[simData.engine]) return;
  panel.dataset.mounted='1';
  try{ SIM_ENGINES[simData.engine](panel, simData, key); }
  catch(err){ panel.innerHTML='<div class="sim-error">This simulation could not load.</div>'; console.error(key, err); }
}

   PAGE STATE + RENDER
   ====================================================================== */
let activeTopic = null;
let openItems = new Set();
let query = '';

const totalSubtopics = SYLLABUS.reduce((n,t)=>n+t.subtopics.length,0);
document.getElementById('topbarMeta').textContent = `${SYLLABUS.length} topics · ${totalSubtopics} subtopics`;

function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function highlight(text){
  if(!query.trim()) return escapeHtml(text);
  const q=query.trim(); const idx=text.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx,idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}
function matches(str){ return str.toLowerCase().includes(query.trim().toLowerCase()); }
function subtopicMatches(st){
  if(!query.trim()) return true;
  if(matches(st.title) || matches(st.notes||'')) return true;
  return st.content.some(c=>matches(c));
}

function renderRail(){
  const axis=document.getElementById('axis');
  axis.innerHTML = SYLLABUS.map(t=>`
    <div class="tick ${activeTopic===t.code?'active':''}">
      <button class="tick-btn" data-topic="${t.code}" aria-current="${activeTopic===t.code}">
        <span class="tick-glyph">${t.glyph}</span>
        <span class="tick-text">
          <span class="tick-code">TOPIC ${t.code}</span>
          <span class="tick-name">${t.title}</span>
          <span class="tick-count">${t.subtopics.length} subtopics</span>
        </span>
      </button>
    </div>`).join('');
  axis.querySelectorAll('.tick-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTopic=btn.dataset.topic; openItems=new Set(); closeRailMobile(); render(); });
  });
}

function renderOverview(){
  return `
    <div class="topic-head">
      <span class="code-badge">Dashboard</span>
      <h1>WAEC Core Mathematics — Overview</h1>
      <p>Select a topic on the axis to the left, or search across every subtopic. Expand any subtopic to read its notes and try a live simulation or calculator built for that idea.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${SYLLABUS.length}</div><div class="l">Topics</div></div>
      <div class="stat"><div class="n">${totalSubtopics}</div><div class="l">Subtopics</div></div>
      <div class="stat"><div class="n">${totalSubtopics}</div><div class="l">Simulations</div></div>
      <div class="stat"><div class="n">2</div><div class="l">Papers</div></div>
      <div class="stat"><div class="n">150</div><div class="l">Total marks</div></div>
    </div>
    <div class="overview-grid">
      ${SYLLABUS.map(t=>`
        <div class="overview-card" role="button" tabindex="0" data-topic="${t.code}">
          <div class="oc-code">TOPIC ${t.code} · ${t.glyph}</div>
          <h3>${t.title}</h3>
          <div class="oc-count">${t.subtopics.length} subtopics</div>
        </div>`).join('')}
    </div>
    <div class="units-panel">
      <h2>Units &amp; Exam Format</h2>
      <table class="units-table">
        ${UNITS.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td></tr>`).join('')}
        <tr><td>Paper 1</td><td>50 multiple-choice questions · 1½ hours · 50 marks</td></tr>
        <tr><td>Paper 2</td><td>13 essay questions (5 compulsory in Section A for 40 marks; answer 5 of 8 in Section B for 60 marks) · 2½ hours · 100 marks</td></tr>
      </table>
    </div>`;
}

function accordionItemHtml(t, st){
  const key = t.code+'-'+st.code;
  const open = openItems.has(key);
  return `
  <div class="item ${open?'open':''}" data-key="${key}">
    <button class="item-head" data-key="${key}">
      <span class="item-code">${st.code}</span>
      <span class="item-title">${highlight(st.title)}</span>
      <span class="item-chevron">›</span>
    </button>
    <div class="item-body">
      <div class="item-body-inner">
        <div class="body-block">
          <p class="body-label content">Content</p>
          <ul class="content-list">${st.content.map(c=>`<li>${highlight(c)}</li>`).join('')}</ul>
        </div>
        ${st.notes ? `<div class="body-block"><p class="body-label notes">Examiner\u2019s Note</p><div class="note-box">${highlight(st.notes)}</div></div>` : ''}
        ${(st.sim || (window.MK && MK.has(key))) ? `<div class="body-block"><p class="body-label sim">Try it — interactive simulation</p><div class="sim-panel" data-key="${key}"></div></div>` : ''}
        ${window.MK ? MK.extras(key).map(k=>`<div class="body-block"><p class="body-label sim">${MK.scenes[k].label||'3D lab'}</p><div class="sim-panel" data-key="${k}"></div></div>`).join('') : ''}
      </div>
    </div>
  </div>`;
}

function renderTopic(t){
  const list = t.subtopics.filter(subtopicMatches);
  return `
    <button class="back-link" id="backBtn">&larr; all topics</button>
    <div class="topic-head">
      <span class="code-badge">Topic ${t.code}</span>
      <h1>${t.title}</h1>
      <p>${t.desc}</p>
    </div>
    ${list.length===0 ? `<div class="empty"><div class="big">∅</div><p>No subtopics match “${escapeHtml(query)}” in this topic.</p></div>` : `
      <div class="accordion">${list.map(st=>accordionItemHtml(t,st)).join('')}</div>`}`;
}

function renderSearchResults(){
  const hits=[];
  SYLLABUS.forEach(t=>{ t.subtopics.forEach(st=>{ if(subtopicMatches(st)) hits.push({t,st}); }); });
  return `
    <div class="topic-head">
      <span class="code-badge">Search</span>
      <h1>Results for “${escapeHtml(query)}”</h1>
      <p>${hits.length} subtopic${hits.length===1?'':'s'} found across the syllabus.</p>
    </div>
    ${hits.length===0 ? `<div class="empty"><div class="big">∅</div><p>Try a different term — e.g. "surds", "bearings", "variance".</p></div>` : `
    <div class="accordion">${hits.map(({t,st})=>accordionItemHtml(t,st)).join('')}</div>`}`;
}

function render(){
  renderRail();
  const content=document.getElementById('content');
  if(query.trim()){
    content.innerHTML = renderSearchResults();
  } else if(activeTopic){
    const t=SYLLABUS.find(x=>x.code===activeTopic);
    content.innerHTML = renderTopic(t);
    const back=document.getElementById('backBtn');
    if(back) back.addEventListener('click', ()=>{ activeTopic=null; render(); });
  } else {
    content.innerHTML = renderOverview();
    content.querySelectorAll('.overview-card').forEach(card=>{
      const go=()=>{ activeTopic=card.dataset.topic; openItems=new Set(); render(); };
      card.addEventListener('click', go);
      card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    });
  }
  content.querySelectorAll('.item-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const key=h.dataset.key;
      if(openItems.has(key)) openItems.delete(key); else openItems.add(key);
      const item=h.closest('.item');
      item.classList.toggle('open');
      if(item.classList.contains('open')) ensureMounted(item);
    });
  });
  content.querySelectorAll('.item.open').forEach(ensureMounted);
}

const searchEl=document.getElementById('search');
searchEl.addEventListener('input', (e)=>{ query=e.target.value; openItems=new Set(); render(); });

const rail=document.getElementById('rail');
const scrim=document.getElementById('scrim');
function openRailMobile(){ rail.classList.add('open'); scrim.classList.add('show'); }
function closeRailMobile(){ rail.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('railToggle').addEventListener('click', ()=>{ rail.classList.contains('open') ? closeRailMobile() : openRailMobile(); });
scrim.addEventListener('click', closeRailMobile);

render();
</script>
</body>
</html>
